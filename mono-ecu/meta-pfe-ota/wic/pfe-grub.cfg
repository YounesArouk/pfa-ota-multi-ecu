serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set default=0
set timeout=3

# Valeurs de secours si grubenv est absent
set ORDER="A B"
set A_OK=1
set A_TRY=0
set B_OK=0
set B_TRY=0

# État A/B persistant, partagé dans la partition EFI
load_env --file=(hd0,gpt1)/EFI/BOOT/grubenv

# Sélection du premier slot valide et non encore essayé
set any_ok=0

for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        set INDEX=0
        set OK=$A_OK
        set TRY=$A_TRY
        set A_TRY=1
    fi

    if [ "$SLOT" == "B" ]; then
        set INDEX=1
        set OK=$B_OK
        set TRY=$B_TRY
        set B_TRY=1
    fi

    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        set default=$INDEX
        set any_ok=1
        break
    fi
done

# Si aucun slot n’est sélectionnable, réinitialise uniquement les essais
if [ "$any_ok" -eq 0 ]; then
    if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then
        set A_TRY=0
    fi

    if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then
        set B_TRY=0
    fi
fi

# Mémorise qu’un slot a été essayé avant son démarrage
save_env --file=(hd0,gpt1)/EFI/BOOT/grubenv A_TRY B_TRY

menuentry "PFE OTA - Slot A" {
    linux /bzImage root=/dev/sda2 rootwait rw rootfstype=ext4 console=ttyS0,115200 console=tty0 noapic panic=60 rauc.slot=A
}

menuentry "PFE OTA - Slot B" {
    linux /bzImage root=/dev/sda3 rootwait rw rootfstype=ext4 console=ttyS0,115200 console=tty0 noapic panic=60 rauc.slot=B
}
