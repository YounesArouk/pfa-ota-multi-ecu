[system]
compatible=pfe-ota-qemux86-64
min-bundle-version=2.0.0
bootloader=grub
grubenv=/boot/EFI/BOOT/grubenv
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=ca.cert.pem

[handlers]
pre-install=/usr/libexec/rauc/pfe-anti-replay-pre
post-install=/usr/libexec/rauc/pfe-anti-replay-post

[slot.rootfs.0]
device=/dev/sda2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/sda3
type=ext4
bootname=B
