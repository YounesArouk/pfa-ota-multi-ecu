# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pfe-ota"
BBFILE_PATTERN_meta-pfe-ota = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pfe-ota = "6"

LAYERDEPENDS_meta-pfe-ota = "core"
LAYERSERIES_COMPAT_meta-pfe-ota = "scarthgap"
